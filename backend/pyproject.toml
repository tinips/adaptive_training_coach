[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-endurance-coach"
version = "0.1.0"
description = "Telegram onboarding, Apple Health and Strava ingestion, and deterministic athlete baselines"
readme = {text = "See the repository-level README for setup and architecture.", content-type = "text/markdown"}
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "cryptography>=44,<48",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "langchain-core>=0.3.30,<2",
    "langchain-openai>=0.3,<2",
    "langgraph>=0.2.60,<2",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "python-telegram-bot>=21.9,<23",
    "sqlalchemy>=2.0.36,<3",
    "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.20,<1",
    "mypy>=1.14,<2",
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["telegram.*", "langgraph.*"]
ignore_missing_imports = true
